<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelGo | Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #0b5ed7, #5ac8fa);
    }

    .register-card {
      width: 100%;
      max-width: 460px;
      padding: 34px 32px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      color: #0b5ed7;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .brand p {
      color: #666;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      outline: none;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #0b5ed7;
      box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 18px 0;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
    }

    .terms a,
    .login-text a {
      color: #0b5ed7;
      font-weight: bold;
      text-decoration: none;
    }

    .register-btn,
    .social-btn {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .register-btn {
      border: none;
      background: #0b5ed7;
      color: white;
    }

    .register-btn:hover {
      background: #094bac;
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #888;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      background: white;
      color: #333;
    }

    .social-btn:hover {
      background: #f5f5f5;
    }

    .github-btn {
      border: none;
      background: #24292f;
      color: white;
    }

    .github-btn:hover {
      background: #111;
    }

    .login-text {
      margin-top: 20px;
      color: #666;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="register-card">
    <div class="brand">
      <h1>✈ TravelGo</h1>
      <p>Create your account and start exploring.</p>
    </div>

    <form id="registerForm">
      <div class="input-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="input-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Choose a username"
          required
        />
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          required
        />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          minlength="6"
          required
        />
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm your password"
          minlength="6"
          required
        />
      </div>

      <label class="terms">
        <input type="checkbox" required />
        <span>
          I agree to the <a href="#">Terms of Service</a> and
          <a href="#">Privacy Policy</a>.
        </span>
      </label>

      <button class="register-btn" type="submit">Create Account</button>
    </form>

    <div class="divider">OR</div>

    <button class="social-btn" type="button">
      🔵 Continue with Google
    </button>

    <button class="social-btn github-btn" type="button">
      ⌘ Continue with GitHub
    </button>

    <p class="login-text">
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </main>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function (event) {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        event.preventDefault();
        alert("Passwords do not match.");
      }
    });
  </script>
</body>
</html>
