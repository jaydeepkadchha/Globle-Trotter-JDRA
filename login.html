<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelGo | Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b5ed7, #5ac8fa);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 38px 32px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      color: #0b5ed7;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .brand p {
      color: #666;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #333;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #0b5ed7;
      box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
    }

    .forgot-password {
      display: block;
      margin: -6px 0 20px;
      color: #0b5ed7;
      font-size: 13px;
      text-align: right;
      text-decoration: none;
    }

    .login-btn,
    .social-btn {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn {
      border: none;
      background: #0b5ed7;
      color: white;
    }

    .login-btn:hover {
      background: #094bac;
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #888;
      font-size: 13px;
      margin: 25px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #ddd;
      background: white;
      margin-bottom: 12px;
      color: #333;
    }

    .social-btn:hover {
      background: #f5f5f5;
    }

    .github-btn {
      background: #24292f;
      color: white;
      border: none;
    }

    .github-btn:hover {
      background: #111;
    }

    .signup-text {
      margin-top: 22px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .signup-text a {
      color: #0b5ed7;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand">
      <h1>✈ TravelGo</h1>
      <p>Sign in and plan your next adventure.</p>
    </div>

    <form>
      <div class="input-group">
        <label for="username">Username or Email</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          required
        />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <a class="forgot-password" href="#">Forgot password?</a>

      <button class="login-btn" type="submit">Login</button>
    </form>

    <div class="divider">OR</div>

    <button class="social-btn" type="button">
      <span>🔵</span>
      Continue with Google
    </button>

    <button class="social-btn github-btn" type="button">
      <span>⌘</span>
      Continue with GitHub
    </button>

    <p class="signup-text">
      Don't have an account?
      <a href="#">Create account</a>
    </p>
  </main>
</body>
</html>
